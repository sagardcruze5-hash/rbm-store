<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RBM STORE - Admin Panel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="admin-container">
        <h2>Add Amazon Affiliate Product</h2>
        <form id="add-product-form">
            <input type="text" id="p-title" placeholder="Product Title" required>
            <input type="text" id="p-price" placeholder="Price (e.g. $25.00)" required>
            <input type="url" id="p-image" placeholder="Image Direct URL" required>
            <textarea id="p-desc" placeholder="Product Short Description" rows="4" required></textarea>
            <input type="url" id="p-link" placeholder="Amazon Affiliate Link" required>
            <button type="submit">Upload Product</button>
        </form>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
