<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RBM STORE</title>
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Main Header -->
    <header class="main-header">
        <div class="logo">
            RBM <span>STORE</span>
        </div>

        <nav class="nav-bar">
            <a href="#">Home</a>
            <a href="#">Shop</a>
            <a href="#">Categories</a>
        </nav>

        <!-- Big Search Container -->
        <div class="search-container">
            <select class="country-dropdown">
                <option value="BD">Bangladesh</option>
                <option value="US">Global</option>
            </select>
            <input type="text" id="search-input" placeholder="Search products, brands, and categories...">
            <button id="search-btn"><i class="fa-solid fa-magnifying-glass"></i> Search</button>
        </div>

        <div class="header-right-tools">
            <div class="header-nav-item" onclick="openAuthModal()">
                <span class="nav-line-1" id="user-display-name">Hello, Sign in</span>
                <span class="nav-line-2">Account & Lists</span>
            </div>

            <div class="header-cart-item">
                <div class="cart-icon-wrap">
                    <i class="fa-solid fa-cart-shopping"></i>
                    <span class="cart-count" id="cart-count">0</span>
                </div>
                <span class="cart-label">Cart</span>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <div class="site-container">
        <aside class="side-nav">
            <h3>Categories</h3>
            <ul>
                <li><a href="#">Electronics</a></li>
                <li><a href="#">Fashion</a></li>
                <li><a href="#">Home Appliances</a></li>
                <li><a href="#">Sports & Outdoors</a></li>
            </ul>
        </aside>

        <main class="content-area">
            <h2 class="section-title">All Products</h2>
            <div class="product-grid" id="product-list">
                <!-- Products will load dynamically from Firebase -->
            </div>
        </main>
    </div>

    <!-- Auth Modal -->
    <div class="modal-overlay" id="auth-modal">
        <div class="modal-box">
            <span class="close-btn" onclick="closeAuthModal()">&times;</span>
            <div class="auth-tabs">
                <button class="active" id="login-tab-btn" onclick="switchAuthTab('login')">Login</button>
                <button id="register-tab-btn" onclick="switchAuthTab('register')">Register</button>
            </div>

            <!-- Login Form -->
            <form class="auth-form" id="login-form">
                <h3>Welcome Back</h3>
                <div class="input-group">
                    <label>Email Address</label>
                    <input type="email" id="login-email" required placeholder="Enter your email">
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="login-password" required placeholder="Enter password">
                </div>
                <button type="submit" class="auth-btn">Sign In</button>
            </form>

            <!-- Register Form -->
            <form class="auth-form" id="register-form" style="display: none;">
                <h3>Create Account</h3>
                <div class="input-group">
                    <label>Full Name</label>
                    <input type="text" id="reg-name" required placeholder="Your name">
                </div>
                <div class="input-group">
                    <label>Email Address</label>
                    <input type="email" id="reg-email" required placeholder="Enter email">
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="reg-password" required placeholder="Create password">
                </div>
                <button type="submit" class="auth-btn">Register</button>
            </form>
        </div>
    </div>

    <!-- Firebase SDKs (Compat Versions) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <!-- Main JavaScript -->
    <script src="app.js"></script>
</body>
</html>
